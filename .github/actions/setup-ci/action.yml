name: Setup CI
description: Install Go, Node, Stream Deck CLI, and restore caches

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Cache npm
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-elgato-cli
        restore-keys: |
          npm-${{ runner.os }}-

    - name: Install Stream Deck CLI
      shell: bash
      run: npm install -g @elgato/cli
