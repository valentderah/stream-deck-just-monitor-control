<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="css/pi.css" />
</head>
<body style="visibility: hidden;">
  <div class="sdpi-wrapper">
    <div class="sdpi-item">
      <label class="sdpi-item-label" data-i18n="Monitors">Monitors</label>
      <div id="monitorPicker" class="sdpi-item-value muted" data-i18n="Loading">Loading…</div>
    </div>
    <div class="sdpi-item">
      <label class="sdpi-item-label" data-i18n="VCPCode">VCP Code</label>
      <input class="sdpi-item-value" type="number" min="0" max="255" data-setting="code" data-default="16" />
    </div>
    <div class="sdpi-item">
      <label class="sdpi-item-label" data-i18n="VCPValue">Value</label>
      <input class="sdpi-item-value" type="number" min="0" max="65535" data-setting="value" data-default="50" />
    </div>
  </div>
  <script src="js/pi-common.js"></script>
  <script>initMonitorPicker({ mode: "single", settingKey: "monitorId" });</script>
</body>
</html>
