<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="css/pi.css" />
</head>
<body style="visibility: hidden;">
  <div class="sdpi-wrapper">
    <div class="sdpi-item">
      <label class="sdpi-item-label" data-i18n="Monitors">Monitors</label>
      <div id="monitorPicker" class="sdpi-item-value muted" data-i18n="Loading">Loading…</div>
    </div>
    <div class="sdpi-item">
      <label class="sdpi-item-label" data-i18n="Mode">Mode</label>
      <select class="sdpi-item-value" data-setting="mode" data-default="set">
        <option value="set" data-i18n="Set">Set</option>
        <option value="step" data-i18n="Step">Step</option>
        <option value="toggle" data-i18n="Toggle">Toggle</option>
      </select>
    </div>
    <div class="sdpi-item" data-visible-when="mode=set">
      <label class="sdpi-item-label" data-i18n="Value">Value</label>
      <input class="sdpi-item-value" type="number" min="0" max="100" data-setting="value" data-default="50" />
    </div>
    <div class="sdpi-item" data-visible-when="mode=step">
      <label class="sdpi-item-label" data-i18n="StepAmount">Step</label>
      <input class="sdpi-item-value" type="number" data-setting="step" data-default="10" />
    </div>
    <div class="sdpi-item" data-visible-when="mode=toggle">
      <label class="sdpi-item-label" data-i18n="ToggleA">Level A</label>
      <input class="sdpi-item-value" type="number" min="0" max="100" data-setting="toggleA" data-default="20" />
    </div>
    <div class="sdpi-item" data-visible-when="mode=toggle">
      <label class="sdpi-item-label" data-i18n="ToggleB">Level B</label>
      <input class="sdpi-item-value" type="number" min="0" max="100" data-setting="toggleB" data-default="80" />
    </div>
  </div>
  <script src="js/pi-common.js"></script>
  <script>initMonitorPicker({ mode: "multi", settingKey: "monitorIds" });</script>
</body>
</html>
